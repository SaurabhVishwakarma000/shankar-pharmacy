<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Login - Shankar Pharmacy</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/img/favicon.png" rel="icon">
  <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="../assets/css/main.css" rel="stylesheet">
</head>

<body class="admin-login-page">

  <main class="admin-auth-wrapper">
    <div class="admin-auth-card">

      <a href="../index.html" class="admin-auth-logo">Shankar Pharmacy</a>
      <p class="admin-auth-subtitle">Admin Login</p>

      <form id="admin-login-form" novalidate>
        <div class="mb-3">
          <label for="admin-username" class="form-label">Username</label>
          <input type="text" id="admin-username" name="username" class="form-control" autocomplete="username"
            required>
        </div>
        <div class="mb-3">
          <label for="admin-password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="admin-password" name="password" class="form-control"
              autocomplete="current-password" required>
            <button type="button" id="admin-password-toggle" class="password-toggle-btn"
              aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <p id="admin-login-error" class="admin-auth-error" role="alert" style="display:none;"></p>

        <button type="submit" id="admin-login-submit" class="btn btn-primary w-100">Login</button>
      </form>

      <a href="../index.html" class="admin-auth-back-link">&larr; Back to website</a>
    </div>
  </main>

  <!-- Vendor JS Files -->
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/api-config.js"></script>
  <script src="../assets/js/admin/admin-auth.js"></script>
</body>

</html>
